<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>聊天历史</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; }
    body {
      font-family: "PingFang SC", "Hiragino Sans GB", sans-serif;
      background: #fffafc;
      border: 2px solid rgba(244, 178, 194, 0.9);
      border-radius: 14px;
      display: flex;
      flex-direction: column;
    }
    #bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 7px 12px 4px;
      font-size: 11px;
      color: #b08a95;
      -webkit-app-region: drag;
      flex: none;
    }
    #bar button {
      -webkit-app-region: no-drag;
      border: none;
      background: none;
      color: #c39aa6;
      font-size: 12px;
      cursor: pointer;
    }
    #bar button.armed { color: #e07a8b; font-weight: 600; }
    #tools {
      flex: none;
      padding: 6px 12px 8px;
    }
    #q {
      width: 100%;
      padding: 7px 12px;
      border: 1.5px solid #eccdd6;
      border-radius: 10px;
      font-size: 13px;
      outline: none;
      color: #5d454c;
      background: #fff;
    }
    #q:focus { border-color: #f4b2c2; }
    #log {
      flex: 1;
      overflow-y: auto;
      padding: 4px 12px;
      display: flex;
      flex-direction: column;
      gap: 7px;
    }
    .row { display: flex; gap: 6px; align-items: flex-end; }
    .row.user { justify-content: flex-end; }
    .msg {
      max-width: 72%;
      padding: 7px 11px;
      border-radius: 12px;
      font-size: 13px;
      line-height: 1.45;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .row.user .msg {
      background: #f9d7e0;
      color: #5d454c;
      border-bottom-right-radius: 4px;
    }
    .row.pet .msg {
      background: #fff;
      border: 1.5px solid #f2dbe2;
      color: #6b4a52;
      border-bottom-left-radius: 4px;
    }
    .meta {
      font-size: 10px;
      color: #c9a3b1;
      white-space: nowrap;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 2px;
      padding-bottom: 2px;
    }
    .row.user .meta { align-items: flex-end; }
    .offline-tag {
      font-size: 9px;
      color: #b3a6ab;
      border: 1px solid #e8d9de;
      border-radius: 4px;
      padding: 0 3px;
      line-height: 1.4;
    }
    .empty {
      margin: auto;
      color: #c9a3b1;
      font-size: 13px;
      text-align: center;
      line-height: 2;
    }
    .group-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: 10px;
      color: #b08a95;
      border-bottom: 1px dashed #eed4dc;
      padding: 4px 2px 5px;
      margin-top: 4px;
    }
    .group-head:first-child { margin-top: 0; }
    .group-head .info { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .group-head button {
      flex: none;
      border: 1px solid #f2dbe2;
      background: #fff;
      color: #d4839a;
      font-size: 10px;
      border-radius: 6px;
      padding: 2px 8px;
      cursor: pointer;
    }
    .group-head button:hover { background: #fdf1f4; }
    #foot {
      flex: none;
      padding: 6px 12px 9px;
      font-size: 10px;
      color: #c9a3b1;
      text-align: center;
    }
  </style>
</head>
<body>
  <div id="bar">
    <span>☁️ 聊天历史（Esc 关闭）</span>
    <span style="display:flex; gap:8px">
      <button id="clear">🗑 清空</button>
      <button id="close" title="关闭">✕</button>
    </span>
  </div>
  <div id="tools"><input id="q" placeholder="搜索聊天记录…" /></div>
  <div id="log"></div>
  <div id="foot"></div>
  <script type="module">
    const T = window.__TAURI__;
    const log = document.getElementById('log');
    const foot = document.getElementById('foot');
    const qEl = document.getElementById('q');
    const clearBtn = document.getElementById('clear');

    const closeWin = () => T.window.getCurrentWindow().close();

    let all = []; // 全量 [{role, text, ts, src}]，磁盘顺序（旧→新）

    const fmtShort = (ts) => {
      const d = new Date(ts);
      const p = (n) => String(n).padStart(2, '0');
      return `${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
    };

    function addRow(r) {
      const row = document.createElement('div');
      row.className = `row ${r.role === 'user' ? 'user' : 'pet'}`;
      const bubble = document.createElement('div');
      bubble.className = 'msg';
      bubble.textContent = String(r.text || '');
      const meta = document.createElement('span');
      meta.className = 'meta';
      const time = document.createElement('span');
      time.textContent = fmtShort(r.ts);
      time.title = new Date(r.ts).toLocaleString('zh-CN');
      meta.appendChild(time);
      if (r.role === 'pet' && r.src === 'offline') {
        const tag = document.createElement('span');
        tag.className = 'offline-tag';
        tag.textContent = '离线';
        tag.title = '离线降级语录（LLM 未启用或失败）';
        meta.appendChild(tag);
      }
      row.appendChild(bubble);
      row.appendChild(meta);
      log.appendChild(row);
    }

    /** 按会话分组：new-chat 标记或相邻消息间隔 >2h 断段（跳过 sys 标记本身）。 */
    function groups() {
      const GAP_MS = 2 * 3600 * 1000;
      const out = [];
      let cur = [];
      let prevTs = 0;
      for (const r of all) {
        if (r.role === 'sys') {
          if (cur.length) out.push(cur);
          cur = [];
          prevTs = 0;
          continue;
        }
        if (prevTs && r.ts - prevTs > GAP_MS) {
          out.push(cur);
          cur = [];
        }
        cur.push(r);
        prevTs = r.ts;
      }
      if (cur.length) out.push(cur);
      return out; // 每组为时间正序的消息数组
    }

    function addGroupHead(rows) {
      const head = document.createElement('div');
      head.className = 'group-head';
      const info = document.createElement('span');
      info.className = 'info';
      info.textContent = `${fmtShort(rows[0].ts)} 开始 · ${rows.length} 条`;
      const btn = document.createElement('button');
      btn.textContent = '📖 继续这段对话';
      btn.title = '恢复这段对话的上下文，接着聊';
      btn.addEventListener('click', () => {
        T.event.emit('chat://resume', rows);
      });
      head.appendChild(info);
      head.appendChild(btn);
      log.appendChild(head);
    }

    function render() {
      log.textContent = '';
      const q = qEl.value.trim().toLowerCase();
      const gs = groups();
      let shown = 0;
      // 最新一组在最上
      for (let g = gs.length - 1; g >= 0; g--) {
        const rows = q
          ? gs[g].filter((r) => String(r.text || '').toLowerCase().includes(q))
          : gs[g];
        if (!rows.length) continue;
        shown += rows.length;
        addGroupHead(rows);
        for (let i = rows.length - 1; i >= 0; i--) addRow(rows[i]);
      }
      if (!shown) {
        const div = document.createElement('div');
        div.className = 'empty';
        div.textContent = all.length ? '没有匹配的记录' : '还没有聊天记录，去和她说句话吧';
        log.appendChild(div);
      }
      const first = all[0];
      foot.textContent = q
        ? `匹配 ${shown} / ${all.filter((r) => r.role !== 'sys').length} 条`
        : `共 ${all.filter((r) => r.role !== 'sys').length} 条 · ${gs.length} 段对话${first ? ` · 最早 ${fmtShort(first.ts)}` : ''}`;
    }

    async function load() {
      try {
        all = (await T.core.invoke('get_data', { key: 'chat_history' })) || [];
      } catch { all = []; }
      render();
    }

    // talk 窗开着时实时追加；清空后重画
    T.event.listen('chat://appended', ({ payload }) => {
      if (Array.isArray(payload)) all.push(...payload);
      render();
    });
    T.event.listen('chat://cleared', () => {
      all = [];
      render();
    });

    // 两步确认（frameless 下 confirm() 不可靠）
    let armTimer = null;
    clearBtn.addEventListener('click', () => {
      if (!all.length) return;
      if (!clearBtn.classList.contains('armed')) {
        clearBtn.classList.add('armed');
        clearBtn.textContent = '确定清空？再点一次';
        armTimer = setTimeout(() => {
          clearBtn.classList.remove('armed');
          clearBtn.textContent = '🗑 清空';
        }, 3000);
        return;
      }
      clearTimeout(armTimer);
      clearBtn.classList.remove('armed');
      clearBtn.textContent = '🗑 清空';
      T.core.invoke('clear_chat').catch(() => {});
    });

    document.getElementById('close').addEventListener('click', closeWin);
    qEl.addEventListener('input', render);
    qEl.addEventListener('keydown', (e) => {
      e.stopPropagation();
      if (e.key === 'Escape') closeWin();
    });
    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeWin();
    });

    load();
  </script>
</body>
</html>
