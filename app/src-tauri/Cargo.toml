[package]
name = "xiaoyun-pet"
version = "0.1.0"
description = "小云桌宠 —— 以黄霄雲为性格原型的个人桌面宠物"
authors = ["kxing"]
edition = "2021"

[lib]
name = "xiaoyun_pet_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png", "protocol-asset"] }
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"

[target."cfg(target_os = \"macos\")".dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSEvent", "NSWindow"] }

[profile.dev]
debug = "line-tables-only"   # 只留行号表，报错仍有行号；砍掉大体积完整调试符号

[profile.dev.package."*"]
debug = false                # 依赖不带调试符号（deps 占 target 体积大头）

[profile.release]
strip = true
lto = true
